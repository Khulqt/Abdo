async function syncCustomersFromOrders(list){

  built.forEach(c=>batch.set(col.doc(String(c.id)),JSON.parse(JSON.stringify(c))));

async function syncCollection(name, items){
  if(!firebaseReady || remoteSyncing) return;
  const col=db.collection(name), snap=await col.get();
  const wanted=new Set(items.map(x=>String(x.id)));
  const batch=db.batch();
  snap.forEach(doc=>{if(!wanted.has(doc.id)) batch.delete(doc.ref)});
  items.forEach(item=>batch.set(col.doc(String(item.id)), JSON.parse(JSON.stringify(item))));
  await batch.commit();
}

function sendWhatsApp(id){let o=orders.find(x=>x.id===id);if(!o)return;let raw=String(o.data['رقم الهاتف']||'').replace(/\D/g,'');if(raw.startsWith('0'))raw='20'+raw.slice(1);else if(!raw.startsWith('20'))raw='20'+raw;let statusText={
'تحت المراجعة':'طلبك ما زال تحت المراجعة، وسيتم إبلاغك بأي تحديث.',
'مقبول':'تم قبول طلبك وجارٍ تنفيذ الخدمة.',
'مكتمل':'تم تنفيذ الخدمة بنجاح. يمكنك مراجعة المكتبة أو التواصل معنا إذا احتجت أي مساعدة.',
'مرفوض':'نعتذر، لم يتم قبول الطلب حاليًا. يمكنك التواصل مع المكتبة لمعرفة التفاصيل.',
'ملغي':'تم إلغاء الطلب. يمكنك التواصل مع المكتبة لمعرفة التفاصيل.'
}[o.status]||('حالة طلبك الحالية: '+o.status);let msg=`مرحبًا ${o.data['الاسم ثلاثي']||''}،\n\nنود إبلاغك بخصوص طلبك في مكتبة أ/ عبدالمنعم طلخان.\nالخدمة: ${o.service}\nكود الاستعلام: ${o.code}\nالحالة: ${o.status}\n\n${statusText}\n\nشكرًا لاستخدام خدمات المكتبة.`;window.open('https://wa.me/'+raw+'?text='+encodeURIComponent(msg),'_blank')}
function viewOrder(id){let o=orders.find(x=>x.id===id);let hist=o.history||[];let logs=activityLogs.filter(x=>x.orderId===id);openModal('تفاصيل الطلب وسجل الحركة',`<div class="receipt"><h3>${esc(o.service)}</h3>${Object.entries(o.data).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}<p><b>الدفع من:</b> ${esc(o.payerPhone)}</p><p><b>الكود:</b> ${o.code}</p><p><b>الحالة الحالية:</b> <span class="tag">${esc(o.status)}</span></p></div><div class="panel"><h3>🕐 الخط الزمني</h3>${hist.length?hist.map(h=>`<div class="notice"><b>${esc(h.status)}</b><br><small>${esc(h.date||'')}</small></div>`).join(''):'لا يوجد سجل قديم لهذا الطلب.'}${logs.map(h=>`<div class="notice">${esc(h.action)} — ${esc(h.details||'')}<br><small>${esc(h.date||'')}</small></div>`).join('')}</div><button class="btn" onclick="printOrder('${id}')">طباعة</button>`)}
function printOrder(id){let o=orders.find(x=>x.id===id);let w=window.open('','_blank');w.document.write(`<html dir="rtl"><head><title>إيصال</title><style>body{font-family:Arial;padding:30px}h1{color:#124e66}</style></head><body><h1>مكتبة أ/ عبدالمنعم طلخان</h1><h2>إيصال طلب</h2><p>الكود: ${o.code}</p><p>الخدمة: ${o.service}</p><p>الاسم: ${o.data['الاسم ثلاثي']}</p><p>الحالة: ${o.status}</p><p>التاريخ: ${o.date}</p><hr><p>شكرًا لاستخدام خدمات المكتبة.</p><script>print()<\/script></body></html>`);w.document.close()}
async function deleteOrder(id){if(!confirm('نقل الطلب إلى سلة المحذوفات؟'))return;let o=orders.find(x=>x.id===id);if(!o)return;try{let deleted={...o,deletedAt:new Date().toISOString()};if(firebaseReady){await db.collection('trashOrders').doc(String(id)).set(JSON.parse(JSON.stringify(deleted)));await db.collection('orders').doc(String(id)).delete();await db.collection('tracking').where('orderId','==',String(id)).get().then(s=>{let b=db.batch();s.forEach(d=>b.delete(d.ref));return b.commit()});await addLog(id,'نقل إلى سلة المحذوفات','تم حذف الطلب من الطلبات النشطة');}trashOrders.unshift(deleted);orders=orders.filter(x=>x.id!==id);localSave();ordersPage();updateBadge()}catch(e){alert('تعذر نقل الطلب: '+e.message)}}
function viewCustomer(id){let c=customers.find(x=>x.id===id);if(!c)return;let st=customerStats(c);let points=Number(c.points||st.completed*10);openModal('بطاقة بيانات العميل',`<div class="customer-card-premium" style="box-shadow:none"><div class="customer-card-top"><div class="customer-avatar"><i class="fa-solid fa-user"></i></div><div class="customer-main"><span class="customer-label">بطاقة العميل</span><h3>${esc(c.name||'بدون اسم')}</h3><p><i class="fa-solid fa-id-card"></i> ${esc(c.nationalId||'—')}</p><p><i class="fa-solid fa-phone"></i> ${esc(c.phone||'—')}</p><div class="customer-points-chip"><i class="fa-solid fa-coins"></i> ${points} نقطة</div></div></div><div class="customer-detail-grid" style="margin-top:18px"><div><b>${st.orders}</b><span>إجمالي الطلبات</span></div><div><b>${st.completed}</b><span>الخدمات المكتملة</span></div><div><b>${st.pending}</b><span>قيد المراجعة</span></div><div><b>${points}</b><span>النقاط</span></div><div><b>${st.rejected}</b><span>مرفوضة</span></div><div><b>${st.spent}</b><span>إجمالي المدفوع</span></div></div></div>`)}
function customersPage(){
 if(!customers.length && orders.length)syncCustomersFromOrders(orders);
 adminContent.innerHTML=`<div class="page-heading"><div><span class="eyebrow">إدارة العملاء</span><h1>العملاء</h1><p>كل عميل محفوظ ببياناته الأساسية فقط، مع ملخص إحصائي مستقل.</p></div><div class="heading-icon"><i class="fa-solid fa-users"></i></div></div>
 <div class="customer-toolbar panel"><div class="toolbar"><input id="custSearch" placeholder="بحث بالاسم أو الرقم القومي أو الهاتف..." oninput="drawCustomers()"><select id="custSort" onchange="drawCustomers()"><option value="new">الأحدث نشاطًا</option><option value="name">الاسم</option><option value="orders">عدد الطلبات</option><option value="spent">إجمالي المدفوع</option></select></div></div>
 <div id="customersGrid" class="customers-grid"></div>`;
 window.drawCustomers=()=>{
  let q=(document.getElementById('custSearch')?.value||'').trim().toLowerCase();
  let a=(customers||[]).filter(c=>[c.name,c.nationalId,c.phone].join(' ').toLowerCase().includes(q));
  if(custSort.value==='name')a.sort((x,y)=>String(x.name||'').localeCompare(String(y.name||''),'ar'));
  if(custSort.value==='orders')a.sort((x,y)=>(y.ordersCount||0)-(x.ordersCount||0));
  if(custSort.value==='spent')a.sort((x,y)=>(y.totalSpent||0)-(x.totalSpent||0));
  if(custSort.value==='new')a.sort((x,y)=>String(y.lastOrderDate||'').localeCompare(String(x.lastOrderDate||'')));
  customersGrid.innerHTML=a.map(c=>{let st=customerStats(c);return `<article class="customer-card-premium">
   <div class="customer-card-top"><div class="customer-avatar"><i class="fa-solid fa-user"></i></div><div class="customer-main"><span class="customer-label">عميل</span><h3>${esc(c.name||'بدون اسم')}</h3><p><i class="fa-solid fa-id-card"></i> ${esc(c.nationalId||'—')}</p><p><i class="fa-solid fa-phone"></i> ${esc(c.phone||'—')}</p></div></div>
   <div class="customer-stats"><div><b>${st.orders}</b><span>إجمالي الطلبات</span></div><div><b>${st.completed}</b><span>مكتملة</span></div><div><b>${st.pending}</b><span>قيد المراجعة</span></div><div><b>${st.rejected}</b><span>مرفوضة</span></div></div>
   <div class="customer-footer"><span><i class="fa-solid fa-wallet"></i> إجمالي المدفوع: <b>${st.spent} جنيه</b></span><span><i class="fa-regular fa-clock"></i> ${esc(c.lastOrderDate||'لا يوجد')}</span></div><div class="customer-points-chip"><i class="fa-solid fa-coins"></i> ${st.completed*10} نقطة</div><button class="customer-open-btn" onclick="viewCustomer('${c.id}')"><i class="fa-solid fa-id-card"></i> فتح بطاقة البيانات والإحصائيات</button>
  </article>`}).join('')||`<div class="empty-state panel"><i class="fa-solid fa-users-slash"></i><h3>لا يوجد عملاء</h3><p>سيظهر العملاء تلقائيًا بعد تسجيل طلباتهم.</p></div>`;
 };
 drawCustomers();
}
function notificationsPage(){let ns=orders.filter(o=>o.isNew);adminContent.innerHTML=`<h1>الإشعارات</h1><div class="panel"><div class="toolbar"><select onchange="sortNotifications(this.value)"><option value="new">الأحدث</option><option value="service">حسب الخدمة</option></select><button class="btn danger" onclick="clearNotifications()">حذف كل الإشعارات</button></div><div class="notify" id="notifyList"></div></div>`;drawNotifications(ns)}
function drawNotifications(a){notifyList.innerHTML=a.map(o=>`<div class="notice"><b>طلب جديد:</b> ${esc(o.data['الاسم ثلاثي'])} — ${esc(o.service)} <button class="btn light" onclick="readNotif('${o.id}')">تمت القراءة</button></div>`).join('')||'لا توجد إشعارات جديدة.'}
function sortNotifications(v){let a=orders.filter(o=>o.isNew);if(v==='service')a.sort((x,y)=>x.service.localeCompare(y.service,'ar'));drawNotifications(a)}
async function readNotif(id){let o=orders.find(x=>x.id===id);if(!o)return;try{await db.collection('orders').doc(String(id)).update({isNew:false});o.isNew=false;notificationsPage();updateBadge()}catch(e){alert('تعذر تحديث الإشعار: '+e.message)}} async function clearNotifications(){try{let b=db.batch();orders.filter(o=>o.isNew).forEach(o=>b.update(db.collection('orders').doc(String(o.id)),{isNew:false}));await b.commit();orders.forEach(o=>o.isNew=false);notificationsPage();updateBadge()}catch(e){alert('تعذر تحديث الإشعارات: '+e.message)}}function updateBadge(){let n=orders.filter(o=>o.isNew).length;let b=document.getElementById('notifBadge');if(b)b.textContent=n}
async function addLog(orderId,action,details=''){let item={id:'log'+Date.now()+Math.random().toString(16).slice(2),orderId:String(orderId),action,details,date:new Date().toLocaleString('ar-EG')};activityLogs.unshift(item);if(firebaseReady&&currentUser&&currentUser.uid===ADMIN_UID)await db.collection('activityLogs').doc(item.id).set(item);localSave()}
function globalSearchPage(){adminContent.innerHTML=`<h1>🔎 البحث العالمي</h1><div class="panel"><div class="toolbar"><input id="globalQ" style="flex:1" placeholder="ابحث في الطلبات والعملاء والخدمات والعروض والمواعيد والكوبونات..." oninput="runGlobalSearch()"></div><div id="globalResults"></div></div>`}
function runGlobalSearch(){let q=(document.getElementById('globalQ')?.value||'').toLowerCase().trim();if(!q){globalResults.innerHTML='اكتب كلمة البحث.';return}let groups=[['طلبات',orders],['خدمات',services],['عروض',offers],['مواعيد',appointmentSlots],['كوبونات',coupons],['عملاء مميزون',vip]];globalResults.innerHTML=groups.map(([name,arr])=>{let m=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(q));return m.length?`<h3>${name} (${m.length})</h3>`+m.slice(0,15).map(x=>`<div class="notice">${esc(x.name||x.service||x.code||x.title||x.date||JSON.stringify(x))}</div>`).join(''):''}).join('')||'لا توجد نتائج.'}
function exportExcel(){let rows=orders.map(o=>({'كود الطلب':o.code,'العميل':o.data?.['الاسم ثلاثي']||'','الخدمة':o.service,'السعر':o.price,'الحالة':o.status,'الهاتف':o.data?.['رقم الهاتف']||'','الرقم القومي':o.data?.['الرقم القومي']||'','التاريخ':o.date||''}));let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'الطلبات');XLSX.writeFile(wb,'تقرير_طلبات_مكتبة_طلخان.xlsx')}
function backupPage(){adminContent.innerHTML=`<h1>💾 النسخ الاحتياطية</h1><div class="panel"><p>أنشئ نسخة محلية كاملة من بيانات لوحة الإدارة، ويمكن استعادتها لاحقًا.</p><button class="btn" onclick="createBackup()">⬇️ إنشاء نسخة احتياطية</button> <label class="btn light" style="display:inline-block;cursor:pointer">⬆️ استعادة نسخة<input type="file" accept="application/json" hidden onchange="restoreBackup(this)"></label><p style="color:var(--muted);margin-top:15px">النسخة تشمل الطلبات والخدمات والإعلانات والعروض والمواعيد والكوبونات وسلة المحذوفات والإعدادات.</p></div>`}
function createBackup(){let data={version:2,createdAt:new Date().toISOString(),services,orders,vip,ads,settings,offers,appointmentSlots,coupons,trashOrders,activityLogs};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='نسخة_احتياطية_مكتبة_طلخان_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
async function restoreBackup(input){let f=input.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!confirm('استعادة النسخة ستستبدل البيانات المحلية الحالية. هل أنت متأكد؟'))return;services=d.services||services;orders=d.orders||orders;vip=d.vip||vip;ads=d.ads||ads;settings=d.settings||settings;offers=d.offers||offers;appointmentSlots=d.appointmentSlots||[];coupons=d.coupons||[];trashOrders=d.trashOrders||[];activityLogs=d.activityLogs||[];localSave();if(firebaseReady&&currentUser&&currentUser.uid===ADMIN_UID){for(const [name,items] of Object.entries({services,vipCustomers:vip,ads,offers,appointmentSlots,coupons,trashOrders,activityLogs})){await syncCollection(name,items)}}alert('تمت استعادة النسخة.');showAdminPage('dashboard')}catch(e){alert('ملف النسخة غير صالح: '+e.message)}}
function trashPage(){adminContent.innerHTML=`<h1>🗑️ سلة المحذوفات</h1><div class="panel">${trashOrders.map(o=>`<div class="notice"><b>${esc(o.code)}</b> — ${esc(o.data?.['الاسم ثلاثي'])} — ${esc(o.service)}<br><small>حُذف: ${esc(o.deletedAt||'')}</small><br><button class="btn light" onclick="restoreOrder('${o.id}')">استرجاع</button><button class="btn danger" onclick="purgeOrder('${o.id}')">حذف نهائي</button></div>`).join('')||'السلة فارغة.'}</div>`}
async function restoreOrder(id){let o=trashOrders.find(x=>x.id===id);if(!o)return;try{let copy={...o};delete copy.deletedAt;if(firebaseReady){await db.collection('orders').doc(String(id)).set(JSON.parse(JSON.stringify(copy)));await db.collection('tracking').doc(String(copy.code)).set({code:copy.code,service:copy.service,status:copy.status,orderId:copy.id},{merge:true});await db.collection('trashOrders').doc(String(id)).delete();await addLog(id,'استرجاع من سلة المحذوفات','تم استرجاع الطلب')}trashOrders=trashOrders.filter(x=>x.id!==id);orders.unshift(copy);localSave();trashPage()}catch(e){alert('تعذر الاسترجاع: '+e.message)}}
async function purgeOrder(id){if(!confirm('حذف نهائي؟ لا يمكن التراجع.'))return;try{if(firebaseReady)await db.collection('trashOrders').doc(String(id)).delete();trashOrders=trashOrders.filter(x=>x.id!==id);localSave();trashPage()}catch(e){alert('تعذر الحذف النهائي: '+e.message)}}
function logsPage(){adminContent.innerHTML=`<h1>🕐 سجل العمليات</h1><div class="panel"><div class="toolbar"><input placeholder="بحث في السجل..." oninput="drawLogs(this.value)"></div><div id="logsList"></div></div>`;drawLogs('')}
function drawLogs(q){let a=activityLogs.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));logsList.innerHTML=a.slice(0,300).map(x=>`<div class="notice"><b>${esc(x.action)}</b> — ${esc(x.details||'')}<br><small>${esc(x.date||'')} | الطلب: ${esc(x.orderId||'—')}</small></div>`).join('')||'لا يوجد سجل.'}
function offersPage(){adminContent.innerHTML=`<h1>🔥 عروضنا</h1><button class="btn" onclick="editOffer()">+ إضافة عرض</button><div class="panel">${offers.map(a=>`<div class="notice"><b>${esc(a.title)}</b> — ${a.active===false?'غير منشور':'منشور'}<br><button class="btn light" onclick="editOffer('${a.id}')">تعديل</button><button class="btn danger" onclick="deleteOffer('${a.id}')">حذف</button></div>`).join('')||'لا توجد عروض.'}</div>`}
function editOffer(id){let a=id?offers.find(x=>x.id===id):{id:'of'+Date.now(),title:'',text:'',buttonText:'اعرض العرض',whatsapp:'',active:true};openModal(id?'تعديل العرض':'إضافة عرض',`<div class="field"><label>عنوان العرض</label><input id="oft" value="${esc(a.title)}"></div><div class="field"><label>نص العرض</label><textarea id="ofx">${esc(a.text)}</textarea></div><div class="field"><label>نص الزر</label><input id="ofb" value="${esc(a.buttonText||'اعرض العرض')}"></div><div class="field"><label>رقم واتساب التحويل (اختياري)</label><input id="ofw" value="${esc(a.whatsapp||settings.whatsapp)}"></div><label><input id="ofa" type="checkbox" ${a.active!==false?'checked':''}> نشر العرض</label><br><br><button class="btn" onclick="saveOffer('${a.id}')">حفظ العرض</button>`);window.saveOffer=async()=>{a.title=oft.value;a.text=ofx.value;a.buttonText=ofb.value;a.whatsapp=ofw.value;a.active=ofa.checked;try{if(firebaseReady)await db.collection('offers').doc(String(a.id)).set(JSON.parse(JSON.stringify(a)));let i=offers.findIndex(x=>x.id===a.id);if(i>=0)offers[i]=a;else offers.push(a);localSave();closeModal();offersPage()}catch(e){alert('تعذر حفظ العرض: '+e.message)}}}
async function deleteOffer(id){if(!confirm('حذف العرض؟'))return;try{if(firebaseReady)await db.collection('offers').doc(String(id)).delete();offers=offers.filter(x=>x.id!==id);localSave();offersPage()}catch(e){alert('تعذر حذف العرض: '+e.message)}}
function appointmentsPage(){adminContent.innerHTML=`<h1>📅 نظام المواعيد</h1><button class="btn" onclick="editAppointment()">+ إضافة موعد</button><div class="panel">${appointmentSlots.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(x=>`<div class="notice"><b>${esc(x.date)}</b> — ${esc(x.time)} — سعة ${x.capacity||1} — ${x.active===false?'متوقف':'متاح'}<br><button class="btn light" onclick="editAppointment('${x.id}')">تعديل</button><button class="btn danger" onclick="deleteAppointment('${x.id}')">حذف</button></div>`).join('')||'لم تتم إضافة مواعيد بعد.'}</div>`}
function editAppointment(id){let x=id?appointmentSlots.find(a=>a.id===id):{id:'ap'+Date.now(),date:new Date().toISOString().slice(0,10),time:'10:00',capacity:1,active:true};openModal('موعد',`<div class="field"><label>التاريخ</label><input id="apd" type="date" value="${x.date}"></div><div class="field"><label>الوقت</label><input id="apt" type="time" value="${x.time}"></div><div class="field"><label>السعة</label><input id="apc" type="number" min="1" value="${x.capacity||1}"></div><label><input id="apa" type="checkbox" ${x.active!==false?'checked':''}> متاح للحجز</label><br><br><button class="btn" onclick="saveAppointment('${x.id}')">حفظ</button>`);window.saveAppointment=async()=>{x.date=apd.value;x.time=apt.value;x.capacity=Number(apc.value||1);x.active=apa.checked;try{if(firebaseReady)await db.collection('appointmentSlots').doc(x.id).set(JSON.parse(JSON.stringify(x)));let i=appointmentSlots.findIndex(a=>a.id===x.id);if(i>=0)appointmentSlots[i]=x;else appointmentSlots.push(x);localSave();closeModal();appointmentsPage()}catch(e){alert('تعذر حفظ الموعد: '+e.message)}}}
async function deleteAppointment(id){if(!confirm('حذف الموعد؟'))return;try{if(firebaseReady)await db.collection('appointmentSlots').doc(id).delete();appointmentSlots=appointmentSlots.filter(x=>x.id!==id);localSave();appointmentsPage()}catch(e){alert('تعذر الحذف: '+e.message)}}
function couponsPage(){adminContent.innerHTML=`<h1>🎟️ الكوبونات والخصومات</h1><button class="btn" onclick="editCoupon()">+ إضافة كوبون</button><div class="panel">${coupons.map(c=>`<div class="notice"><b>${esc(c.code)}</b> — خصم ${esc(c.discount)}${c.type==='percent'?'%':' ج'} — ${c.active===false?'متوقف':'فعال'}<br><button class="btn light" onclick="editCoupon('${c.id}')">تعديل</button><button class="btn danger" onclick="deleteCoupon('${c.id}')">حذف</button></div>`).join('')||'لا توجد كوبونات.'}</div>`}
function editCoupon(id){let c=id?coupons.find(x=>x.id===id):{id:'cp'+Date.now(),code:'',discount:10,type:'percent',active:true,limit:0,used:0};openModal('كوبون خصم',`<div class="field"><label>الكود</label><input id="cpc" value="${esc(c.code)}"></div><div class="field"><label>قيمة الخصم</label><input id="cpd" type="number" value="${c.discount}"></div><div class="field"><label>النوع</label><select id="cpt"><option value="percent" ${c.type==='percent'?'selected':''}>نسبة مئوية</option><option value="fixed" ${c.type==='fixed'?'selected':''}>مبلغ ثابت</option></select></div><div class="field"><label>حد الاستخدام 0 = بلا حد</label><input id="cpl" type="number" value="${c.limit||0}"></div><label><input id="cpa" type="checkbox" ${c.active!==false?'checked':''}> فعال</label><br><br><button class="btn" onclick="saveCoupon('${c.id}')">حفظ</button>`);window.saveCoupon=async()=>{c.code=cpc.value.trim().toUpperCase();c.discount=Number(cpd.value);c.type=cpt.value;c.limit=Number(cpl.value||0);c.active=cpa.checked;try{if(firebaseReady)await db.collection('coupons').doc(c.id).set(JSON.parse(JSON.stringify(c)));let i=coupons.findIndex(x=>x.id===c.id);if(i>=0)coupons[i]=c;else coupons.push(c);localSave();closeModal();couponsPage()}catch(e){alert('تعذر حفظ الكوبون: '+e.message)}}}
async function deleteCoupon(id){if(!confirm('حذف الكوبون؟'))return;try{if(firebaseReady)await db.collection('coupons').doc(id).delete();coupons=coupons.filter(x=>x.id!==id);localSave();couponsPage()}catch(e){alert('تعذر الحذف: '+e.message)}}
function servicesPage(){adminContent.innerHTML=`<h1>إدارة الخدمات</h1><button class="btn" onclick="editService()">+ إضافة خدمة</button><div class="panel">${services.map(s=>`<div class="notice"><i class="${s.icon}"></i> <b>${esc(s.name)}</b> — ${s.price} ج <button class="btn light" onclick="editService('${s.id}')">تعديل</button><button class="btn danger" onclick="removeService('${s.id}')">حذف</button></div>`).join('')}</div>`}
function editService(id){let s=id?services.find(x=>x.id===id):{id:'s'+Date.now(),cat:'الحجز والتقديم',name:'',price:15,icon:'fa-solid fa-star',fields:['الاسم ثلاثي','الرقم القومي','العنوان','رقم الهاتف','المؤهل','ملاحظات']};openModal(id?'تعديل الخدمة':'إضافة خدمة',`<div class="field"><label>الاسم</label><input id="sn" value="${esc(s.name)}"></div><div class="field"><label>القسم</label><input id="sc" value="${esc(s.cat)}"></div><div class="field"><label>السعر</label><input id="sp" type="number" value="${s.price}"></div><div class="field"><label>أيقونة Font Awesome</label><input id="si" value="${s.icon}"></div><div class="field"><label>البيانات المطلوبة (افصل بفاصلة)</label><textarea id="sf">${s.fields.join('، ')}</textarea></div><button class="btn" onclick="saveService('${s.id}')">حفظ</button>`);window.saveService=(sid)=>{s.name=sn.value;s.cat=sc.value;s.price=+sp.value;s.icon=si.value;s.fields=sf.value.split(/[،,]/).map(x=>x.trim()).filter(Boolean);if(!id)services.push(s);saveAll();closeModal();servicesPage();renderHome()}}
function removeService(id){if(confirm('حذف الخدمة؟')){services=services.filter(s=>s.id!==id);saveAll();servicesPage();renderHome()}}
function vipPage(){adminContent.innerHTML=`<h1>العملاء المميزين</h1><button class="btn" onclick="editVip()">+ إضافة عميل مميز</button><div class="panel">${vip.map(v=>`<div class="notice"><b>${esc(v.name)}</b> — ${esc(v.note)} <button class="btn light" onclick="editVip('${v.id}')">تعديل</button><button class="btn danger" onclick="delVip('${v.id}')">حذف</button></div>`).join('')||'لا يوجد عملاء مميزون.'}</div>`}
function editVip(id){let v=id?vip.find(x=>x.id===id):{id:'v'+Date.now(),name:'',note:''};openModal('العميل المميز',`<div class="field"><label>الاسم</label><input id="vn" value="${esc(v.name)}"></div><div class="field"><label>الوصف</label><input id="vnote" value="${esc(v.note)}"></div><button class="btn" onclick="saveVip('${v.id}')">حفظ</button>`);window.saveVip=()=>{v.name=vn.value;v.note=vnote.value;if(!id)vip.push(v);saveAll();closeModal();vipPage();renderHome()}}
function delVip(id){vip=vip.filter(v=>v.id!==id);saveAll();vipPage();renderHome()}
function adsPage(){adminContent.innerHTML=`<h1>الإعلانات</h1><button class="btn" onclick="editAd()">+ إعلان جديد</button><div class="panel">${ads.map(a=>`<div class="notice"><b>${esc(a.title)}</b><br>${esc(a.text)}<br><button class="btn light" onclick="editAd('${a.id}')">تعديل</button><button class="btn danger" onclick="delAd('${a.id}')">حذف</button></div>`).join('')||'لا توجد إعلانات.'}</div>`}
function editAd(id){let a=id?ads.find(x=>x.id===id):{id:'a'+Date.now(),title:'',text:'',active:true};openModal('الإعلان',`<div class="field"><label>العنوان</label><input id="at" value="${esc(a.title)}"></div><div class="field"><label>النص</label><textarea id="ax">${esc(a.text)}</textarea></div><button class="btn" onclick="saveAd('${a.id}')">حفظ</button>`);window.saveAd=async()=>{a.title=at.value;a.text=ax.value;try{if(firebaseReady&&currentUser&&currentUser.uid===ADMIN_UID)await db.collection('ads').doc(String(a.id)).set(JSON.parse(JSON.stringify(a)));if(!id)ads.push(a);else {let i=ads.findIndex(x=>x.id===a.id);if(i>=0)ads[i]=a;}localSave();closeModal();adsPage();renderHome()}catch(e){alert('تعذر حفظ الإعلان: '+e.message);console.error(e)}}}
async function delAd(id){if(!confirm('حذف الإعلان؟'))return;try{if(firebaseReady&&currentUser&&currentUser.uid===ADMIN_UID)await db.collection('ads').doc(String(id)).delete();ads=ads.filter(a=>a.id!==id);localSave();adsPage();renderHome()}catch(e){alert('تعذر حذف الإعلان: '+e.message)}}
function paymentsPage(){let total=orders.reduce((x,o)=>x+Number(o.price||0),0);adminContent.innerHTML=`<h1>المدفوعات والإيرادات</h1><div class="stats">${stat('fa-money-bill-wave','إجمالي الإيرادات',total+' ج')}${stat('fa-receipt','عدد العمليات',orders.length)}</div><div class="panel">${orders.map(o=>`<p>${esc(o.data['الاسم ثلاثي'])} — ${o.service} — <b>${o.price} ج</b> — ${esc(o.payerPhone)}</p>`).join('')||'لا توجد مدفوعات.'}</div>`}
function settingsPage(){
 const savedSound=localStorage.getItem('maktaba_admin_sound')||'alert';
 const sounds=[['alert','تنبيه قوي — ثلاث نغمات'],['urgent','إنذار عاجل — متتابع'],['bell','جرس إداري — واضح'],['radar','رادار — نبضات سريعة'],['classic','كلاسيكي — نغمتان'],['digital','رقمي — صعود وهبوط'],['triple','ثلاثي قوي — لفت الانتباه'],['short','قصير — نقرة تنبيه']];
 adminContent.innerHTML=`<h1>الإعدادات</h1><div class="panel"><div class="field"><label>رقم الدفع</label><input id="setPhone" value="${esc(settings.phone)}"></div><div class="field"><label>رقم واتساب</label><input id="setWa" value="${esc(settings.whatsapp)}"></div><div class="field"><label>معلومات المكتبة</label><input id="setInfo" value="${esc(settings.info)}"></div><hr><h2>🔧 وضع الصيانة</h2><label><input id="maintOn" type="checkbox" ${settings.maintenance?.enabled?'checked':''}> تفعيل وضع الصيانة</label><div class="field"><label>أيقونة Font Awesome</label><input id="maintIcon" value="${esc(settings.maintenance?.icon||'fa-solid fa-screwdriver-wrench')}"></div><div class="field"><label>عنوان الصيانة</label><input id="maintTitle" value="${esc(settings.maintenance?.title||'الموقع تحت الصيانة')}"></div><div class="field"><label>وصف الصيانة</label><textarea id="maintText">${esc(settings.maintenance?.text||'نعمل حاليًا على تطوير الموقع. برجاء العودة قريبًا.')}</textarea></div><hr><h2>🔊 صوت إشعار الطلبات الجديدة</h2><p style="color:var(--muted)">اختر صوتًا قويًا ومميزًا، ثم اضغط تجربة الصوت.</p><div class="field"><label>الصوت</label><select id="soundSelect">${sounds.map(x=>`<option value="${x[0]}" ${savedSound===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt" onclick="previewSelectedSound()">🔊 تجربة الصوت</button><button class="btn" onclick="saveSettings()">حفظ الإعدادات</button></div></div>`
}
async function saveSettings(){settings.phone=setPhone.value;settings.whatsapp=setWa.value;settings.info=setInfo.value;settings.maintenance={enabled:document.getElementById('maintOn')?.checked||false,icon:document.getElementById('maintIcon')?.value||'fa-solid fa-screwdriver-wrench',title:document.getElementById('maintTitle')?.value||'الموقع تحت الصيانة',text:document.getElementById('maintText')?.value||''};let ss=document.getElementById('soundSelect');if(ss)localStorage.setItem('maktaba_admin_sound',ss.value);await db.collection('settings').doc('main').set(settings,{merge:true});alert('تم حفظ الإعدادات');}
updateBadge();

showLogin(!(firebase.auth().currentUser&&firebase.auth().currentUser.uid===ADMIN_UID));
</script></body></html>
